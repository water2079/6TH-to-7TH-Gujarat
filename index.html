<!DOCTYPE html><html lang="gu"><head>    <meta charset="UTF-8">    <title>૭મું પગાર પંચ - ૧૮ો દિવસ નિયમ કેલ્ક્યુલેટર</title>    <style>        body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; background: #f8fafc; padding: 30px; color: #1e293b; line-height: 1.5; }        .container { max-width: 1100px; background: #ffffff; padding: 35px; border-radius: 16px; margin: auto; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; }        h2 { text-align: center; color: #1e3a8a; border-bottom: 3px solid #3b82f6; padding-bottom: 15px; margin-top: 0; font-size: 24px; font-weight: 700; }        .rule-box { background: #fef2f2; border-left: 5px solid #ef4444; padding: 15px 20px; margin-bottom: 30px; border-radius: 8px; font-size: 14px; color: #991b1b; box-shadow: inset 0 1px 2px rgba(0,0,0,0.02); }        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 25px; background: #f1f5f9; padding: 25px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #e2e8f0; }        .field { display: flex; flex-direction: column; }        label { font-weight: 600; margin-bottom: 8px; color: #334155; font-size: 14px; }        input, select { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; background-color: #ffffff; transition: all 0.3s ease; color: #0f172a; }        input:focus, select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 600; letter-spacing: 0.5px; transition: all 0.2s ease; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2); }        button:hover { background: linear-gradient(135deg, #1e40af 0%, #1d4ed8 100%); transform: translateY(-1px); box-shadow: 0 6px 12px -1px rgba(37, 99, 235, 0.3); }        button:active { transform: translateY(0); }        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 20px; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; }        th { background: #1e293b; color: #f8fafc; padding: 14px; text-align: center; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }        td { border-bottom: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; padding: 14px; text-align: center; color: #334155; font-size: 15px; }        td:last-child { border-right: none; }        tr:last-child td { border-bottom: none; }        tr:nth-child(even) { background: #f8fafc; }        tr:hover { background: #f1f5f9; transition: background-color 0.2s ease; }        .badge { padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; display: inline-block; }        .bg-fix { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }        .bg-inc { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }        .final-pay { font-weight: 700; color: #0f172a; font-size: 16px; }    </style></head><body><div class="container">    <h2>6th to 7th Pay Fixation & Increment Report </h2>    <div class="rule-box">        <strong>  Shreyansh Prajapati, Ayan Patel  [PH MECH CIRCLE, Ahmedabad]   </strong>     </div>    <div class="input-grid">        <div class="field">            <label>Total Basic Pay (6th Pay)</label>            <input type="number" id="payInBand" value="5830">        </div>        <div class="field">            <label>Grade Pay</label>            <select id="gradePay">                <option value="1300">1300 (Level IS-1)</option>                <option value="1400">1400 (Level IS-2)</option>                <option value="1650">1650 (Level IS-3)</option>                <option value="1800">1800</option>                <option value="1900" selected>1900</option>                <option value="2000">2000</option> 0, 159300, 164100, 169000, 174100, 179300, 184700, 190200, 195900, 201800, 207900, 214100],    "8900": [131100, 135000, 139100, 143300, 147600, 152000, 156600, 161300, 166100, 171100, 176200, 181500, 186900, 192500, 198300, 204200, 210300, 216600],    "10000": [144200, 148500, 153000, 157600, 162300, 167200, 172200, 177400, 182700, 188200, 193800, 199600, 205600, 211800, 218200],    "HAG": [182200, 187700, 193300, 199100, 205100, 211300, 217600, 224100],    "CS": [225000, 225000, 225000]};function calculateIncrement() {    const bandPay = parseFloat(document.getElementById('payInBand').value);    const gpValue = document.getElementById('gradePay').value;    const fixDateStr = document.getElementById('fixDate').value;    if(!fixDateStr || !payMatrix[gpValue] || isNaN(bandPay)) {        alert("કૃપા કરીને બધી વિગતો સાચી ભરો.");        return;    }    let fixationDate;    if (fixDateStr.includes("-") && fixDateStr.split("-")[0].length === 4) {        fixationDate = new Date(fixDateStr);    } else {        const parts = fixDateStr.split(/[-/]/);        if (parts.length === 3) {            if (parts[2].length === 4) {                fixationDate = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));            } else {                fixationDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));            }        } else {            fixationDate = new Date(fixDateStr);        }    }    const minimumLimitDate = new Date("2016-01-01");    if(fixationDate < minimumLimitDate) {        alert("તારીખ 01-01-2016 કરતા જૂની ન હોવી જોઈએ. / Date cannot be older than 1st Jan 2016.");        return;    }    const tbody = document.getElementById('tableBody');    tbody.innerHTML = "";    document.getElementById('resultArea').style.display = 'block';    const levelData = payMatrix[gpValue];    let currentPay = 0;    let dispGP = gpValue === "10 class-1" ? "Class-1 5400" : gpValue;        function formatDateDDMMYYYY(dObj) {        let d = dObj.getDate();        let m = dObj.getMonth() + 1;        let y = dObj.getFullYear();        return (d < 10 ? '0' + d : d) + '-' + (m < 10 ? '0' + m : m) + '-' + y;    }    if (gpValue === "CS") {        currentPay = 225000;        addTableRow(formatDateDDMMYYYY(fixationDate), "ફિક્સ પે ફિક્સેશન", dispGP, "Fixed", currentPay, "bg-fix");    } else {        const gpNumeric = gpValue === "10 class-1" ? 5400 : (isNaN(parseInt(gpValue)) ? 0 : parseInt(gpValue));        const fitmentVal = (bandPay + gpNumeric) * 2.57;                currentPay = levelData.find(v => v >= fitmentVal);        if (!currentPay) currentPay = levelData[levelData.length - 1];                 addTableRow(formatDateDDMMYYYY(fixationDate), "૭મા પંચ મુજબ મૂળ ફિક્સેશન", dispGP, fitmentVal.toFixed(2), currentPay, "bg-fix");    }    let nextIncDate;    const fixYear = fixationDate.getFullYear();    let julyFirst = new Date(fixYear, 6, 1);    let janFirstNext = new Date(fixYear + 1, 0, 1);    const msInDay = 1000 * 60 * 60 * 24;    const diffToJuly = Math.round((julyFirst - fixationDate) / msInDay);    const diffToJan = Math.round((janFirstNext - fixationDate) / msInDay);    if (diffToJuly >= 180) {         nextIncDate = julyFirst;    } else if (diffToJan >= 180) {        nextIncDate = janFirstNext;    } else {        nextIncDate = new Date(fixYear + 1, 6, 1);     }    const currentYearLimit = new Date(2026, 11, 31);     while (nextIncDate <= currentYearLimit) {        if (gpValue === "CS") break;        let idx = levelData.indexOf(currentPay);        if (idx !== -1 && idx + 1 < levelData.length) {            currentPay = levelData[idx + 1];             addTableRow(formatDateDDMMYYYY(nextIncDate), "વાર્ષિક ઇજાફો (Increment)", dispGP, "---", currentPay, "bg-inc");        } else {            break;         }        nextIncDate = new Date(nextIncDate.setFullYear(nextIncDate.getFullYear() + 1));    }}function addTableRow(date, desc, gp, calc, pay, cls) {    let levelName = "";    switch(gp) {        case "1300": levelName = "Level IS-1 (GP 1300)"; break;        case "1400": levelName = "Level IS-2  (GP 1400)"; break;        case "1650": levelName = "Level IS-3 (GP 1650)"; break;        case "1800": levelName = "Level 1 (GP 1800)"; break;        case "1900": levelName = "Level 2 (GP 1900)"; break;        case "2000": levelName = "Level 3 (GP 2000)"; break;        case "2400": levelName = "Level 4 (GP 2400)"; break;        case "2800": levelName = "Level 5 (GP 2800)"; break;        case "4200": levelName = "Level 6 (GP 4200)"; break;        case "4400": levelName = "Level 7 (GP 4400)"; break;        case "4600": levelName = "Level 8 (GP 4600)"; break;        case "5400": levelName = "Level 9 (GP 5400)"; break;        case "Class-1 5400": levelName = "Level 10 (GP 5400)"; break;        case "6600": levelName = "Level 11 (GP 6600)"; break;        case "7600": levelName = "Level 12 (GP 7600)"; break;        case "8700": levelName = "Level 13 (GP 8700)"; break;        case "8900": levelName = "Level 13A (GP 8900)"; break;        case "10000": levelName = "Level 14 (GP 10000)"; break;        case "HAG": levelName = "Level 15 (HAG)"; break;        case "CS": levelName = "Cabinet Sec / Apex"; break;        default: levelName = "GP " + gp;    }    const row = `<tr>        <td><span class="badge ${cls}">${desc}</span></td>        <td>${levelName}</td>        <td><strong><b>${date}</b></strong></td>        <td class="final-pay">₹ ${pay.toLocaleString('en-IN')}</td>    </tr>`;    document.getElementById('tableBody').innerHTML += row;    if(desc.includes("૭મા પંચ મુજબ મૂળ ફિક્સેશન") || desc.includes("ફિક્સ પે ફિક્સેશન")) {        let summaryDiv = document.getElementById('fitmentSummaryCard');        if(!summaryDiv){            summaryDiv = document.createElement('div');            summaryDiv.id = 'fitmentSummaryCard';            summaryDiv.style.marginBottom = '25px';            summaryDiv.style.padding = '18px';            summaryDiv.style.background = '#eff6ff';            summaryDiv.style.borderLeft = '5px solid #3b82f6';            summaryDiv.style.borderRadius = '8px';            summaryDiv.style.fontSize = '14px';            summaryDiv.style.boxShadow = '0 1px 3px rgba(0,0,0,0.05)';            document.getElementById('summaryPlacement').appendChild(summaryDiv);        }        summaryDiv.innerHTML = `<strong>ગણતરી (Fitment Coefficient) વિશ્લેષણ:</strong><br>        • સૂત્ર: (Total Basic Pay + Grade Pay) × 2.57<br>        • ગણતરી રકમ: (${document.getElementById('payInBand').value} + ${gp === "Class-1 5400" ? 5400 : gp}) × 2.57 = <b>₹ ${calc}</b><br>        • ૭મા પગાર પંચના મેટ્રિક્સમાં નજીકનું આગામી સ્ટેજ (બેઝિક પગાર રકમ): <b>₹ ${pay.toLocaleString('en-IN')}</b>`;    }}// HOOK: Real-time dynamic current date integration up to today (May 2026)window.addEventListener('DOMContentLoaded', () => {    const timeDisplay = document.getElementById('currentTime');    if (timeDisplay) {        const now = new Date();        timeDisplay.innerText = "Current Date & Time: " + now.toLocaleString('en-IN');    }    const heading = document.querySelector('h2');    if (heading && heading.innerText.includes('(Up to 2026)')) {        const currentYear = new Date().getFullYear();        heading.innerText = heading.innerText.replace('(Up to 2026)', `(Up to ${currentYear})`);    }});const originalCalculateIncrement = calculateIncrement;calculateIncrement = function() {    const backupYearLimit = typeof currentYearLimit !== 'undefined' ? currentYearLimit : new Date(2026, 11, 31);    const actualToday = new Date();    const originalScript = originalCalculateIncrement.toString();    if (originalScript.includes('currentYearLimit')) {        const dynamicLimit = actualToday;        const oldWhile = window.while;        const oldFn = window.calculateIncrement;    }    originalCalculateIncrement();    const tbody = document.getElementById('tableBody');    if (tbody && tbody.rows.length > 0) {        const gpValue = document.getElementById('gradePay').value;        if (gpValue !== "CS" && payMatrix[gpValue]) {            const levelData = payMatrix[gpValue];            let lastRow = tbody.rows[tbody.rows.length - 1];            let lastDateText = lastRow.cells[2].innerText;            let lastPayText = lastRow.cells[3].innerText.replace(/[^0-9]/g, '');            let currentPay = parseInt(lastPayText);            let parts = lastDateText.split('-');            let lastDate = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));            let nextIncDate = new Date(lastDate.setFullYear(lastDate.getFullYear() + 1));            const actualTodayLimit = new Date();            while (nextIncDate <= actualTodayLimit) {                let idx = levelData.indexOf(currentPay);                if (idx !== -1 && idx + 1 < levelData.length) {                    currentPay = levelData[idx + 1];                    let dispGP = gpValue === "10 class-1" ? "Class-1 5400" : gpValue;                    let levelName = "";                    switch(dispGP) {                        case "1300": levelName = "Level IS-1 (GP 1300)"; break;                        case "1400": levelName = "Level IS-2 (GP 1400)"; break;                        case "1650": levelName = "Level IS-3 (GP 1650)"; break;                        case "1800": levelName = "Level 1 (GP 1800)"; break;                        case "1900": levelName = "Level 2 (GP 1900)"; break;                        case "2000": levelName = "Level 3 (GP 2000)"; break;                        case "2400": levelName = "Level 4 (GP 2400)"; break;                        case "2800": levelName = "Level 5 (GP 2800)"; break;                        case "4200": levelName = "Level 6 (GP 4200)"; break;                        case "4400": levelName = "Level 7 (GP 4400)"; break;                        case "4600": levelName = "Level 8 (GP 4600)"; break;                        case "5400": levelName = "Level 9 (GP 5400)"; break;                        case "Class-1 5400": levelName = "Level 10 (GP 5400)"; break;                        case "6600": levelName = "Level 11 (GP 6600)"; break;                        case "7600": levelName = "Level 12 (GP 7600)"; break;                        case "8700": levelName = "Level 13 (GP 8700)"; break;                        case "8900": levelName = "Level 13A (GP 8900)"; break;                        case "10000": levelName = "Level 14 (GP 10000)"; break;                        case "HAG": levelName = "Level 15 (HAG)"; break;                        case "CS": levelName = "Cabinet Sec / Apex"; break;                        default: levelName = "GP " + dispGP;                    }                    function innerFormatDate(dObj) {                        let d = dObj.getDate();                        let m = dObj.getMonth() + 1;                        let y = dObj.getFullYear();                        return (d < 10 ? '0' + d : d) + '-' + (m < 10 ? '0' + m : m) + '-' + y;                    }                    const row = `<tr>                        <td><span class="badge bg-inc">વાર્ષિક ઇજાફો (Increment)</span></td>                        <td>${levelName}</td>                        <td><strong><b>${innerFormatDate(nextIncDate)}</b></strong></td>                        <td class="final-pay">₹ ${currentPay.toLocaleString('en-IN')}</td>                    </tr>`;                    tbody.innerHTML += row;                } else {                    break;                }                nextIncDate = new Date(nextIncDate.setFullYear(nextIncDate.getFullYear() + 1));            }        }    }};</script>
<script>
// HOOK: Real-time Dynamic Injector to auto-fill Row Numbers into the first column
function injectRowNumbers() {
    const rows = document.querySelectorAll('#tableBody tr');
    rows.forEach((row, index) => {
        if (!row.classList.contains('has-sr-no')) {
            const numCell = document.createElement('td');
            numCell.innerText = (index + 1).toString();
            numCell.style.fontWeight = "600";
            numCell.style.color = "#475569";
            numCell.style.background = "#f8fafc";
            row.insertBefore(numCell, row.firstChild);
            row.classList.add('has-sr-no');
        }
    });
}

// Watch table and update rows dynamic numbers on execution
window.addEventListener('DOMContentLoaded', () => {
    const tbodyElement = document.getElementById('tableBody');
    if (tbodyElement) {
        const observer = new MutationObserver(injectRowNumbers);
        observer.observe(tbodyElement, { childList: true });
    }
});
</script>
